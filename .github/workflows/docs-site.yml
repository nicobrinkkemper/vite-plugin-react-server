# Deploys the dogfooded docs site (docs-site/) to GitHub Pages.
#
# The site is statically generated by vite-plugin-react-server itself,
# building against the repo's HEAD — so this workflow doubles as a live
# integration test: a change that breaks SSG breaks this build.
name: docs-site

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "docs-site/**"
      - "plugin/**"
      - "package.json"
      - ".github/workflows/docs-site.yml"
  # PRs build (but don't deploy) the site — this is the living integration
  # test: a change that breaks SSG fails here, in the PR that caused it.
  pull_request:
    paths:
      - "docs/**"
      - "docs-site/**"
      - "plugin/**"
      - "package.json"
      - ".github/workflows/docs-site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Per-ref groups: PR builds never queue behind (or cancel) a production
# deployment — only same-branch runs contend. On main, queue rather than
# cancel: cancelling an in-progress Pages DEPLOYMENT strands it server-side,
# and the next deploy-pages then waits behind the phantom until its 10-minute
# timeout (the 3.8.0-merge failure). PR refs may cancel their own superseded
# builds — nothing deploys there.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # docs-site imports vite-plugin-react-server via package self-reference,
      # which resolves to dist/ — build the plugin first.
      - run: npm run build
      - run: npm run build:docs-site
        env:
          BASE_URL: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: docs-site/dist/static

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
