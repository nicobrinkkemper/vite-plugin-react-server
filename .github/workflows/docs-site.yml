# Deploys the dogfooded docs site (docs-site/) to GitHub Pages.
#
# The site is statically generated by vite-plugin-react-server itself,
# building against the repo's HEAD — so this workflow doubles as a live
# integration test: a change that breaks SSG breaks this build.
name: docs-site

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "docs-site/**"
      - "plugin/**"
      - "package.json"
      - ".github/workflows/docs-site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # docs-site imports vite-plugin-react-server via package self-reference,
      # which resolves to dist/ — build the plugin first.
      - run: npm run build
      - run: npm run build:docs-site
        env:
          BASE_URL: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/dist/static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
