name: test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Run full test suite
        run: npm run test-all

      - name: Webpack transport matrix (root + subpath base)
        run: npm run test:transport-webpack

      - name: Verify package manifest (publint + entrypoints)
        run: npm run build && npm run verify:package

  # The react-server-loader PEER contract, proven from the consumer side:
  # pack the plugin, install the tarball into a fresh consumer on each React
  # track (stable, and the exact experimental snapshot the peer range names),
  # and assert a single copy of react / react-dom / react-server-loader
  # resolves. The repo's own fixtures resolve by self-reference and cannot
  # see a duplicated tree.
  peer-install:
    name: packed-consumer peer install (stable + experimental)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Peer install on both tracks
        run: npm run test:peer-install

  root-install-bake:
    name: packed-consumer root-install edge bake
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      # The layout the repo's own fixtures cannot take (they resolve the
      # plugin by self-reference — always the hoisted path): the plugin
      # installed at a consumer's root, a server page importing the package
      # client barrel, edge bake on. Proves dist/server-edge stays free of
      # statically-evaluated node builtins (bd y4l3's Cloudflare 10021 class).
      - name: Root-install edge bake gate
        run: npm run test:root-install-bake

  # Dev client navigation from a packed install, in Chromium. An installed
  # package is pre-bundled by Vite's dep optimizer for the browser; the
  # fixtures resolve the plugin by self-reference and are never pre-bundled,
  # so they cannot see a client reference that loads a second copy of a
  # package next to its pre-bundle (Link degrading to a document load, a
  # package component missing its provider's context).
  installed-dev-navigation:
    name: packed-consumer dev navigation (browser)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Resolve Playwright version (cache key)
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Chromium
        timeout-minutes: 20
        run: npx playwright install --with-deps chromium

      - name: Dev navigation gate (esm + webpack transports)
        run: npm run test:installed-dev-navigation

  # The webpack bake pair on REAL workerd. The edge-bundle guard proves
  # "no node builtins" by static analysis; this job proves the runtime claims
  # by execution: one isolate, no nodejs_compat — boot, flight render,
  # consumer HTML render, action round-trip, loud gate rejection.
  #
  # workerd comes via miniflare, deliberately NOT a dependency of this repo:
  # the suite skips wherever miniflare is absent, and this job scratch-installs
  # it (--no-save keeps package.json and the lockfile untouched). Pin @4 — the
  # latest tag resolves to a 5.x alpha with a changed constructor schema.
  workerd-smoke:
    name: workerd smoke (edge bake pair in a real isolate)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install (+ scratch miniflare)
        run: |
          npm ci
          npm i --no-save miniflare@4

      - name: Run the smoke in both conditions
        env:
          # Fail closed: a broken miniflare install must fail this job, not
          # skip the suite green. Local runs without miniflare still skip.
          VPRS_REQUIRE_MINIFLARE: "1"
        run: |
          npm run build
          ./scripts/test-both.sh test/examples/workerd-smoke.test.ts
          ./scripts/test-both.sh test/examples/host-edge-entry.test.ts

  # Drive a REAL browser against a REAL installed consumer.
  #
  # Everything above tests this repo against its own fixtures, which resolve the
  # plugin by package self-reference. An installed consumer resolves it through
  # `node_modules`, and that difference is not cosmetic — it is where the bugs
  # live. Two shipped regressions were invisible to the fixtures and obvious
  # here:
  #
  #   - a document wrapper importing the hosted `Css`/`Root` degraded every route
  #     to an <html>-less fragment (only reproducible from node_modules), and
  #   - the demo's production server — plain Node, deliberately NO
  #     `--conditions react-server` — died on load, because the plugin's own
  #     `stream/index.client.js` was being stubbed out as a client component.
  #
  # So: pack the plugin exactly as a consumer would install it, install THAT into
  # the demo, build it, boot the plain-Node production server, and drive Chromium
  # against it. Server actions round-trip and hydration is asserted.
  e2e:
    name: e2e (demo app, plain-Node prod server)
    runs-on: ubuntu-latest
    # Must exceed the Install Chromium step's own cap, or the job timeout
    # always wins and the step cap is decorative (checkout/build/install eat
    # minutes before the step even starts).
    timeout-minutes: 30
    steps:
      - name: Checkout the plugin
        uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Build + pack the plugin (the bytes a consumer installs)
        run: |
          npm ci
          npm run build
          npm pack

      - name: Checkout the demo app
        uses: actions/checkout@v6
        with:
          repository: nicobrinkkemper/vite-plugin-react-server-demo-official
          path: demo

      - name: Install the demo against THIS build of the plugin
        working-directory: demo
        run: |
          npm ci
          npm install ../vite-plugin-react-server-*.tgz

      # The browser download has no timeout of its own and Playwright's CDN
      # has real bad hours (2026-08-19: installs crawled for 10–25 minutes,
      # some finishing, some cancelled). The cache removes the download from
      # the common path after one success per Playwright version; the step
      # timeout is deliberately GENEROUS — tight enough to kill a true
      # never-completes, loose enough that a slow-but-alive download still
      # finishes and seeds the cache.
      - name: Resolve Playwright version (cache key)
        id: playwright-version
        working-directory: demo
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Chromium
        working-directory: demo
        timeout-minutes: 20
        run: npx playwright install --with-deps chromium

      - name: e2e — build, boot the prod server, drive the browser
        working-directory: demo
        run: npm run test:e2e

  # The release gate from docs/releasing.md step 1d: this repo's own
  # `npx playwright test` (test/e2e) against the demo's DEV servers. The `e2e`
  # job above runs the demo's suite against its production server; this one
  # covers what only dev has: both dev conditions, hydration and client
  # navigation, client-imported server functions, CSS and React HMR, server
  # action persistence. It ran only on a maintainer's machine before, so it
  # could go red without anyone seeing it.
  #
  # Same layout as the release procedure: the plugin and the demo are sibling
  # directories, and the demo gets the packed tarball (not a file: link, which
  # would lend the demo this repo's React). `--no-save` keeps the demo's
  # package.json and lockfile untouched, so the last step can require a clean
  # tree: the specs write fixtures into the demo's src/ and must restore
  # every one of them.
  dev-browser-gate:
    name: dev browser gate (test/e2e against the demo's dev servers)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BIDOOF_TEMPLATE: ${{ github.workspace }}/bidoof-template
    steps:
      - name: Checkout the plugin
        uses: actions/checkout@v6
        with:
          path: vite-plugin-react-server

      - name: Checkout the demo app
        uses: actions/checkout@v6
        with:
          repository: nicobrinkkemper/vite-plugin-react-server-demo-official
          path: bidoof-template

      - uses: actions/setup-node@v6
        with:
          node-version-file: vite-plugin-react-server/.nvmrc
          cache: npm
          cache-dependency-path: vite-plugin-react-server/package-lock.json

      - name: Build + pack the plugin (the bytes a consumer installs)
        working-directory: vite-plugin-react-server
        run: |
          npm ci
          npm run build
          npm pack

      - name: Install the demo against THIS build of the plugin
        working-directory: bidoof-template
        run: |
          npm ci
          npm install --no-save ../vite-plugin-react-server/vite-plugin-react-server-*.tgz
          # npm keeps the published copy when the install does not land, and
          # the gate would then pass against the wrong code.
          want="$(node -p "require('../vite-plugin-react-server/package.json').version")"
          got="$(node -p "require('./node_modules/vite-plugin-react-server/package.json').version")"
          test -f node_modules/vite-plugin-react-server/package.json
          test ! -L node_modules/vite-plugin-react-server
          test "$got" = "$want"

      - name: Resolve Playwright version (cache key)
        id: playwright-version
        working-directory: vite-plugin-react-server
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Chromium
        working-directory: vite-plugin-react-server
        timeout-minutes: 20
        run: npx playwright install --with-deps chromium

      - name: Dev browser gate (npx playwright test)
        working-directory: vite-plugin-react-server
        run: npx playwright test --reporter=github,list

      - name: The demo checkout is clean (every fixture restored)
        if: always()
        working-directory: bidoof-template
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"

  # The static-host browser proofs (prerendered Suspense hydration, dumb-host
  # client navigation) live in test/examples behind a browser gate — without
  # this job CI would skip them green forever. Runs them under BOTH conditions
  # via test-both.sh; VPRS_REQUIRE_BROWSER makes the gate fail closed, so a
  # missing Chromium fails the job instead of skipping the suite. The vitest
  # filters are substring matches: a name that exists on this branch runs, a
  # sibling that has not merged yet simply matches nothing.
  browser-regressions:
    name: browser regressions (static-host proofs, both conditions)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Resolve Playwright version (cache key)
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Chromium
        timeout-minutes: 20
        run: npx playwright install --with-deps chromium

      - name: Run the proofs in both conditions
        env:
          VPRS_REQUIRE_BROWSER: "1"
        run: |
          npm run build
          ./scripts/test-both.sh static-suspense-hydration static-navigation static-notfound-navigation dev-error-recovery action-outcomes edge-streaming-suspense-reveal transport-webpack-suspense static-subpath-contracts inline-flight-url

      # Exact-path invocation, deliberately separate: substring filters fail
      # open (a misspelled or deleted target matches nothing while the other
      # filters keep the shared run green), an exact path fails the job with
      # "no test files found".
      - name: Stream and dependency regressions (fail-closed by exact path)
        env:
          VPRS_REQUIRE_BROWSER: "1"
        run: ./scripts/test-both.sh test/examples/transport-webpack-stream-static.test.ts test/examples/edge-stream-split-views.test.ts test/examples/static-dependency-client-hydration.test.ts

  # macOS is where contributors run this suite by hand, and it is where the
  # platform quietly diverges from every Linux lane above: stock /bin/bash is
  # 3.2 (no associative arrays — scripts/test-dev-both-modes.sh died on it for
  # months, unnoticed, #419), `localhost` resolves to an IPv6-only Vite bind,
  # and file watching is FSEvents rather than inotify. Deliberately narrow —
  # build, the dev suite under BOTH conditions via the STOCK shell, and the
  # client half — so it stays cheap (macOS minutes bill at 10x) while still
  # covering the shell + watcher + resolver surfaces that actually differ.
  # Playwright is left to the Linux lanes on purpose: the Chromium download is
  # the flaky, expensive part and proves nothing macOS-specific.
  test-macos:
    name: macOS (stock bash 3.2, dev suite both conditions, client half)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      # Invoked through /bin/bash explicitly, not `npm run test:dev:both`, so
      # a bash-4-ism in the script fails HERE instead of on a contributor's
      # laptop. Homebrew bash is not on the runner's PATH ahead of /bin/bash.
      - name: Dev suite, both conditions, under stock /bin/bash 3.2
        run: |
          /bin/bash --version | head -1
          /bin/bash scripts/test-dev-both-modes.sh

      - name: Client suite
        run: npx vitest run
